name: Release

# Publishes the app.
#
#   - Desktop installers: Windows (.exe), macOS (.dmg), Linux (.AppImage).
#     Double-click to install, no Node, no terminal.
#   - The portable server bundle (.zip), for running it headless or on a box
#     that should not have a GUI.
#
# Every push replaces the `latest` release, so its URL always serves the
# current build. A version tag publishes a permanent release alongside it.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only needed to satisfy config validation during the build; the app reads
  # its real values at runtime.
  DATABASE_URL: postgresql://phantom:phantom@localhost:5432/phantom
  SESSION_SECRET: build-time-session-secret-at-least-32-chars
  ENCRYPTION_KEY: build-time-encryption-key-at-least-32-chars

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform should not deny the others a release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux app
            artifact: phantom-linux
            pattern: dist/desktop/*.AppImage
          - os: windows-latest
            label: Windows app
            artifact: phantom-windows
            pattern: dist/desktop/*.exe
          - os: macos-latest
            label: macOS app
            artifact: phantom-macos
            pattern: dist/desktop/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The desktop app wraps this bundle, so it has to exist first.
      # `--no-archive`: the installer embeds the staged directory, and `zip`
      # is not present on the Windows runner.
      - name: Build the server bundle
        run: npm run package:editor -- --no-archive

      - name: Build the installer
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          retention-days: 30
          if-no-files-found: error

  bundle:
    name: Portable server bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:editor
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-bundle
          path: dist/phantom-editor-*.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [desktop, bundle]
    # Runs even when one platform failed, so a Windows-only problem does not
    # withhold the macOS and Linux apps.
    if: always() && needs.bundle.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          find downloads -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      # `gh` ships on the runner and creates the tag through the API, so no
      # tag has to be pushed by hand.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            gh release create "$tag" release/* --title "Phantom ${tag}" --generate-notes \
              || gh release upload "$tag" release/* --clobber
          else
            tag="latest"
            {
              printf '## Install\n\n'
              printf '| Your computer | Download |\n|---|---|\n'
              printf '| Windows | `Phantom-Setup-*.exe` |\n'
              printf '| Mac | `Phantom-*.dmg` (arm64 for Apple Silicon, x64 for Intel) |\n'
              printf '| Linux | `Phantom-*.AppImage` |\n\n'
              printf 'Download, open it, done — nothing else to install.\n\n'
              printf 'The app is not code-signed, so the first launch needs one extra step:\n'
              printf 'on Windows, **More info → Run anyway**; on macOS, **right-click → Open**.\n\n'
              printf '`phantom-editor-*.zip` is the same app without a window — a portable\n'
              printf 'server you start with `./start.sh` and use in a browser. Needs Node 20+.\n\n'
              printf 'Video export additionally needs ffmpeg installed; everything else runs\n'
              printf 'out of the box.\n\n'
              printf -- '---\n\nBuilt from `%s` (`%s`).\n' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}"
            } > notes.md

            gh release delete "$tag" --yes --cleanup-tag || true
            gh release create "$tag" release/* \
              --title "Phantom — latest build" --notes-file notes.md --target "$GITHUB_SHA"
          fi

          echo "Released: $(gh release view "$tag" --json url --jq .url)"
