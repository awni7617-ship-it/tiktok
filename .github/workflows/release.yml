name: Release

# Publishes a downloadable editor build.
#
#   - On a tag (`v0.1.0`): builds the bundle and attaches it to a GitHub
#     release, so it is downloadable from the repository's Releases page.
#   - On demand or on a push to main: uploads the same bundle as a workflow
#     artifact, downloadable from the run's summary page.
#
# The bundle is a Next.js standalone build — it runs with `node server.js`
# and a Postgres URL, with no clone, install or build step.

on:
  push:
    # Feature branches build it too, so the download does not have to wait for
    # a merge to exist.
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package editor build
    runs-on: ubuntu-latest
    env:
      # The build only needs these to satisfy config validation; the bundle
      # reads its real values from the operator's `.env` at runtime.
      DATABASE_URL: postgresql://phantom:phantom@localhost:5432/phantom
      SESSION_SECRET: build-time-session-secret-at-least-32-chars
      ENCRYPTION_KEY: build-time-encryption-key-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run package:editor

      - name: Checksum
        run: |
          cd dist
          sha256sum phantom-editor-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Available on every run, tagged or not — this is the "download the
      # editor" path for anyone who does not want to wait for a release.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-editor
          path: |
            dist/phantom-editor-*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      # A release, not just an artifact: artifacts expire, are zipped a second
      # time by GitHub, and cannot be downloaded without signing in. A release
      # asset is a plain link anyone can click.
      #
      # `gh` ships on the runner, so this needs no third-party action and no
      # token beyond the one the workflow already has. It also creates the tag
      # through the API, so no tag has to be pushed by hand.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A version tag is a permanent release; never overwrite one.
            tag="${GITHUB_REF_NAME}"
            gh release create "$tag" dist/phantom-editor-*.zip dist/SHA256SUMS.txt \
              --title "Phantom editor ${tag}" --generate-notes \
              || gh release upload "$tag" dist/phantom-editor-*.zip dist/SHA256SUMS.txt --clobber
          else
            # A rolling release, replaced on every push, so /releases/latest
            # always serves the current build.
            tag="latest"
            {
              printf 'Built automatically from `%s` (`%s`).\n\n' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}"
              printf '**Download `phantom-editor-*.zip` below.** Unzip it, run `./start.sh`\n'
              printf '(Windows: `start.cmd`), then open <http://localhost:3000>.\n\n'
              printf 'Node 20+ is the only requirement — no install, no database, no API keys.\n'
              printf 'Video export additionally needs ffmpeg on `PATH`; everything else runs\n'
              printf 'from the bundle.\n'
            } > release-notes.md

            gh release delete "$tag" --yes --cleanup-tag || true
            gh release create "$tag" dist/phantom-editor-*.zip dist/SHA256SUMS.txt \
              --title "Phantom editor — latest build" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          echo "Download: $(gh release view "$tag" --json url --jq .url)"
