name: Deploy to Cloudflare

# Auto-deploy. Every push to a deploy branch builds the Worker and ships it —
# no dashboard build settings, no local wrangler, nothing to click.
#
# Setup is one secret:
#
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN   ← create at dash.cloudflare.com/profile/api-tokens
#                              using the "Edit Cloudflare Workers" template
#
# Optional, and set as GitHub secrets too — this workflow pushes them into the
# Worker so you never touch `wrangler secret put`:
#
#   DATABASE_URL      Postgres. Without it the app runs but saves nothing.
#   SESSION_SECRET    openssl rand -base64 48
#   ENCRYPTION_KEY    openssl rand -base64 48  (changing it invalidates every
#                                               connected social account)
#   ANTHROPIC_API_KEY Optional; the offline provider is used without it.
#
# Until CLOUDFLARE_API_TOKEN exists the workflow does nothing and says so,
# rather than failing every push with a red X.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # `secrets` is not available in a job-level `if`, so the guard is a step
      # and everything after it is conditional.
      - name: Check for credentials
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret set — skipping deploy. Add one in Settings → Secrets and variables → Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      # Idempotent: an existing bucket is not an error worth failing on, and
      # a missing one breaks the deploy with a binding error that names the
      # bucket but not the fix.
      - name: Ensure the media bucket exists
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        run: npx wrangler r2 bucket create phantom-media

      - name: Build and deploy
        if: steps.guard.outputs.ready == 'true'
        run: npm run cf:deploy:ci

      # After the first deploy the Worker exists, so secrets can be attached.
      # Each is skipped when its GitHub secret is unset — this never
      # overwrites a value you set by hand with an empty one.
      - name: Sync secrets
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          put() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "set $name"
            else
              echo "skipped $name (no GitHub secret of that name)"
            fi
          }
          put DATABASE_URL "$DATABASE_URL"
          put SESSION_SECRET "$SESSION_SECRET"
          put ENCRYPTION_KEY "$ENCRYPTION_KEY"
          put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"

      - name: Where it is
        if: steps.guard.outputs.ready == 'true'
        run: |
          echo "Deployed. Your Worker is at the workers.dev URL shown above."
          echo "Health check: <worker-url>/api/health"
