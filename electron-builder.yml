# Desktop packaging.
#
#   npm run desktop:build      # installer for the current OS, into dist/desktop
#
# The app bundles the standalone server produced by `npm run package:editor`,
# so that has to run first — CI does both in order.
appId: app.phantom.editor
productName: Phantom
copyright: Phantom

directories:
  output: dist/desktop
  buildResources: build

# Only the Electron glue ships as app code. Everything the server needs is an
# extra resource, because it has its own node_modules and must not be merged
# into the asar archive.
files:
  - desktop/**/*
  - package.json

extraResources:
  - from: dist/phantom-editor
    to: app-server

# Electron already provides Node, so nothing from the project's own
# dependencies needs installing into the app.
npmRebuild: false

# Publishing is the release workflow's job. Without this, electron-builder
# detects CI and tries to upload to GitHub itself, then fails for want of a
# token it was never meant to have.
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned: Windows will warn on first run. Signing needs a certificate that
  # belongs to whoever ships this, not to the repository.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Phantom

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.video
  # Unsigned and un-notarised, so Gatekeeper needs right-click → Open the
  # first time. Same reason as Windows.
  identity: null

linux:
  target: [AppImage]
  category: AudioVideo
  synopsis: AI content studio for short-form video
