# Local stack: Postgres, the web app, and a worker.
#
# The worker is a separate service rather than a thread inside the web process
# so a long render cannot starve request handling, and so render capacity can
# be scaled independently (`docker compose up --scale worker=4`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phantom
      POSTGRES_PASSWORD: phantom
      POSTGRES_DB: phantom
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phantom -d phantom']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "npx prisma migrate deploy && npm start"
    environment:
      DATABASE_URL: postgresql://phantom:phantom@postgres:5432/phantom
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-value-32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-development-encryption-key-value-32}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
    ports:
      - '3000:3000'
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://phantom:phantom@postgres:5432/phantom
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-value-32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-development-encryption-key-value-32}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage
      WORKER_CONCURRENCY: 2
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
    volumes:
      # Shares the media volume with the web app so renders can read uploads.
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media:
